name: CI

# All three triggers, because a template has to be right for the typical repository, whose check
# is not a pure function of its own tree — it installs from a network and can rot in place while
# nothing is pushed (ADR-0010, in the management hub). Drop one only with the reason recorded in
# this repository's own `docs/adr/`.
on:
  pull_request:
  push:
    branches: [main]
  # GitHub disables a schedule after 60 days without repository activity, and emails the Owner
  # when it does.
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  engineering:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: CLAUDE.md is still a symlink to AGENTS.md
        run: |
          mode=$(git ls-files -s CLAUDE.md | cut -d' ' -f1)
          [ "$mode" = 120000 ] || {
            echo "CLAUDE.md has mode '${mode:-missing}', expected 120000." >&2
            exit 1
          }
      - name: MAP.md exists
        run: test -f MAP.md
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build, format and lint
        run: npm run agent -- verify --layer engineering --evidence outputs/engineering.json
      - name: Audit production dependencies
        run: npm run agent -- verify --layer dependencies --evidence outputs/dependencies.json
      - name: Verify generated map
        run: npm run agent -- verify --layer map --evidence outputs/map.json
      - name: Verify TypeScript contracts
        run: npm run agent -- verify --layer types --evidence outputs/types.json
      - name: Verify mathematics and content
        run: npm run agent -- verify --layer math --evidence outputs/math.json
      - name: Verify built rendering
        run: npm run agent -- verify --layer render --evidence outputs/render.json
      - name: Retain exact production artifact for browser jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-dist
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
      - name: Retain engineering evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engineering-evidence
          path: outputs/
          if-no-files-found: ignore

  browser:
    needs: engineering
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Download the engineering job's production artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: production-dist
          path: dist/
      - name: Install browser
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          npx playwright install --with-deps chromium
      - name: Verify production browser shard
        run: npm run agent -- verify --layer browser --built --shard ${{ matrix.shard }}/3 --evidence outputs/browser-${{ matrix.shard }}.json
      - name: Retain shard verification, screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-evidence-${{ matrix.shard }}
          path: outputs/
          if-no-files-found: ignore

  # Keep the required status name; skipped or cancelled dependencies must fail it.
  checks:
    if: always()
    needs: [engineering, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require engineering and every browser shard to pass
        env:
          ENGINEERING_RESULT: ${{ needs.engineering.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$ENGINEERING_RESULT" = success && test "$BROWSER_RESULT" = success
